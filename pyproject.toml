[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "posteriorrestore"
version = "0.1.0"
description = "PosteriorRestore: Degradation-Marginalized Null-Space Posteriors for Blind Image Restoration"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "torch>=2.2", "scikit-learn>=1.3", "matplotlib>=3.7", "pillow>=10"]

[project.scripts]
posteriorrestore = "posteriorrestore.cli:main"

[tool.setuptools.packages.find]
include = ["posteriorrestore*"]

[project.optional-dependencies]
image-metrics = ["lpips>=0.1.4", "pysodmetrics>=1.4"]
